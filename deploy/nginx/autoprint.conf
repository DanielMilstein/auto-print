# Autoprint behind nginx, TLS terminated with a Tailscale certificate.
#
#   sudo cp deploy/nginx/autoprint.conf /etc/nginx/sites-available/autoprint
#   sudo ln -s /etc/nginx/sites-available/autoprint /etc/nginx/sites-enabled/autoprint
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace JETSON.TAILNET.ts.net (3 places) with the MagicDNS name from `tailscale status`.
# The certificate files are produced by deploy/renew-tailscale-cert.sh.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 80;
	listen [::]:80;
	server_name _;
	return 301 https://$host$request_uri;
}

server {
	# `listen ... http2` works on every nginx version Ubuntu ships (the newer `http2 on;` needs >= 1.25.1)
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name JETSON.TAILNET.ts.net;

	ssl_certificate     /etc/ssl/tailscale/JETSON.TAILNET.ts.net.crt;
	ssl_certificate_key /etc/ssl/tailscale/JETSON.TAILNET.ts.net.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	# g-code uploads. adapter-node's own limit is disabled via BODY_SIZE_LIMIT in .env.
	client_max_body_size 256m;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;

		# SvelteKit (adapter-node) rebuilds the public origin from these; they must match the
		# browser's Origin header or every form POST is rejected as cross-site. $host carries no
		# port on 443, so X-Forwarded-Host is the bare hostname, exactly as the browser sends it.
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-Host  $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

		proxy_set_header Upgrade    $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		# Timelapse / failure-image endpoints stream; uploads are large. Don't buffer either way.
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}
